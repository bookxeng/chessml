[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessml"
version = "0.1.0"
description = "Chess rules engine and gym-style environment for training ML agents"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
train = ["torch"]
llm = ["openai", "transformers", "accelerate"]

[project.scripts]
chessml = "chessml.cli:main"

[tool.setuptools]
packages = ["chessml", "chessml_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: deep perft runs (deselect with -m 'not slow')"]
